spring.application.name=sentry-poc-spring
server.port=${SPRING_PORT:8080}

# Official Sentry Spring Boot 4 integration (io.sentry:sentry-spring-boot-4).
# DSN is injected from the environment — not hardcoded in source.
sentry.dsn=${SENTRY_DSN_SPRING:}
sentry.environment=${SENTRY_ENVIRONMENT:poc}
sentry.release=${SENTRY_RELEASE:}
sentry.server-name=sentry-poc-spring
sentry.send-default-pii=false
sentry.tags.service=sentry-poc-spring

# PoC tracing sample rate. Isolated here on purpose.
# Production MUST use a lower traces-sample-rate or a tracesSampler bean.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}

# Structured logs (Sentry.logger + optional Logback forwarding).
sentry.logs.enabled=true

# Application Metrics are enabled by default in SDK >= 8.34.0.
sentry.metrics.enabled=true

# Attach W3C traceparent on outbound HTTP in addition to sentry-trace / baggage.
sentry.propagate-traceparent=true

# Do not enable profiling or session replay.

# Downstream Python service called by RestClient.
sentry.poc.downstream-base-url=${SENTRY_POC_DOWNSTREAM_BASE_URL:http://127.0.0.1:8002}
sentry.poc.uptime-mode=${SENTRY_POC_UPTIME_MODE:}

# Default HTTP client timeouts (Spring Boot 4). The timeout test uses a stricter RestClient.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s

logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.example.sentrypoc=INFO
logging.pattern.console=%d{ISO8601} [%thread] %-5level service=sentry-poc-spring %logger{36} - %msg%n
